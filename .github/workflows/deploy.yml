name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Build on CI (linux amd64) — ship artifact; VPS does not npm build (like bacpq)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Production node_modules
        run: rm -rf node_modules && npm ci --omit=dev
      - name: Pack release
        run: |
          tar -czf deal-release.tar.gz \
            .next \
            node_modules \
            public \
            package.json \
            package-lock.json \
            next.config.ts \
            tsconfig.json \
            postcss.config.mjs \
            deploy \
            scripts
      - uses: actions/upload-artifact@v4
        with:
          name: deal-release
          path: deal-release.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deal-release
          path: release

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy release to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "Missing VPS_HOST or VPS_USER"
            exit 1
          fi
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            release/deal-release.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/deal-release.tar.gz"

      - name: Deploy on VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "Missing VPS_HOST or VPS_USER"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s << 'EOF'
          set -euo pipefail

          RELEASE=/tmp/deal-release.tar.gz
          UNPACK=/tmp/deal-unpack
          APP_DIR=/var/www/deal.codayroi.com/app

          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          tar -xzf "$RELEASE" -C "$UNPACK"

          if [ ! -f /etc/systemd/system/deal-codayroi.service ]; then
            echo "==> First-time: seed APP_DIR + setup-vps-webinoly.sh"
            sudo mkdir -p /var/www/deal.codayroi.com
            sudo rm -rf "$APP_DIR"
            sudo mkdir -p "$APP_DIR"
            sudo tar -xzf "$RELEASE" -C "$APP_DIR"
            sudo bash "$APP_DIR/scripts/setup-vps-webinoly.sh"
          fi

          if [ ! -e /etc/nginx/sites-available/deal.codayroi.com ]; then
            echo "WARN: site deal.codayroi.com missing — app still on :3000"
            echo "  sudo site deal.codayroi.com -proxy=[127.0.0.1:3000]"
            echo "  sudo site deal.codayroi.com -ssl=on"
          fi

          echo "==> deploy.sh --release"
          sudo env APP_DIR="$APP_DIR" \
            bash "$UNPACK/scripts/deploy.sh" --release "$RELEASE"

          rm -rf "$UNPACK"
          rm -f "$RELEASE"
          EOF
