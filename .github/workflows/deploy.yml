name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Smoke-check on CI — production build runs again on VPS (native better-sqlite3)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "Missing VPS_HOST or VPS_USER"
            exit 1
          fi
          # Same pattern as bacpq: SSH as the user that has the key (often root), then sudo on VPS
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "export BRANCH='${{ github.ref_name }}' REPO='https://github.com/${{ github.repository }}.git'; bash -s" << 'EOF'
          set -euo pipefail

          APP_DIR=/var/www/deal.codayroi.com/app

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "==> Clone $APP_DIR (path exists but is not a git repo — reset)"
            sudo mkdir -p "$(dirname "$APP_DIR")"
            # Always remove leftover non-git dir (failed prior setup, empty folder, etc.)
            sudo rm -rf "$APP_DIR"
            sudo git clone -b "$BRANCH" "$REPO" "$APP_DIR"
          fi

          echo "==> git sync $BRANCH"
          sudo git -C "$APP_DIR" fetch origin
          sudo git -C "$APP_DIR" checkout "$BRANCH"
          sudo git -C "$APP_DIR" reset --hard "origin/$BRANCH"

          # Run setup if unit missing OR runtime user missing (stale unit from older deploys)
          if [ ! -f /etc/systemd/system/deal-codayroi.service ] || ! id -u deal >/dev/null 2>&1; then
            echo "==> setup-vps.sh (creates APP_USER=deal + unit; wipes data.db if first/clean setup)"
            sudo bash "$APP_DIR/deploy/setup-vps.sh"
          else
            sudo chown -R deal:deal "$APP_DIR" || true
          fi

          if [ ! -e /etc/nginx/sites-available/deal.codayroi.com ]; then
            echo "WARN: Webinoly site deal.codayroi.com not found — app still deploys on :3000"
            echo "  sudo site deal.codayroi.com -proxy=[127.0.0.1:3000]"
            echo "  sudo site deal.codayroi.com -ssl=on"
          fi

          echo "==> deploy.sh"
          sudo bash "$APP_DIR/deploy/deploy.sh"
          EOF
